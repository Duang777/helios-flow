services:
  opencode:
    build:
      context: ./docker/opencode
    image: opencode-mvp
    container_name: helios-opencode
    restart: unless-stopped
    environment:
      # Unified AI provider/model selection. New deployments set HELIOS_AI_*;
      # the legacy OPENCODE_* variables stay forwarded as a BC fallback so
      # the entrypoint picks them up when HELIOS_AI_* is empty.
      HELIOS_AI_PROVIDER: ${HELIOS_AI_PROVIDER:-openai}
      HELIOS_AI_MODEL: ${HELIOS_AI_MODEL:-gpt-5-mini}
      # Legacy provider selection (anthropic, openai, google) — BC only.
      OPENCODE_PROVIDER: ${OPENCODE_PROVIDER:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      # Provider API keys (set the one matching HELIOS_AI_PROVIDER)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      # MCP configuration
      OPENCODE_MCP_URL: ${OPENCODE_MCP_URL:-http://host.docker.internal:3001/mcp}
      MCP_SERVER_API_KEY: ${MCP_SERVER_API_KEY:-}
    ports:
      - "${OPENCODE_PORT:-4096}:4096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - helios-network

  postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: helios-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-helios}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helios-network

  redis:
    image: redis:7-alpine
    container_name: helios-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf --maxmemory ${REDIS_MAXMEMORY:-512mb}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helios-network

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: helios-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helios-network

  localstack:
    image: localstack/localstack:latest
    container_name: helios-localstack
    restart: unless-stopped
    profiles:
      - storage-s3
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localhost
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - helios-network

  verdaccio:
    image: verdaccio/verdaccio:6
    container_name: helios-verdaccio
    restart: unless-stopped
    environment:
      VERDACCIO_PORT: 4873
      VERDACCIO_PUBLIC_URL: http://localhost:4873
    ports:
      - "${VERDACCIO_PORT:-4873}:4873"
    volumes:
      - verdaccio_storage:/verdaccio/storage
      - verdaccio_plugins:/verdaccio/plugins
      - ./config/verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4873/-/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helios-network

volumes:
  postgres_data:
    name: helios-postgres-data
  redis_data:
    name: helios-redis-data
  meilisearch_data:
    name: helios-meilisearch-data
  localstack_data:
    name: helios-localstack-data
  verdaccio_storage:
    name: helios-verdaccio-storage
  verdaccio_plugins:
    name: helios-verdaccio-plugins

networks:
  helios-network:
    name: helios-network
    driver: bridge
